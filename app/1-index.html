<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#07194a"><link rel="manifest" href="2-manifest.json"><link rel="apple-touch-icon" href="4-icon-192.png"><title>ملازم د. علي يونس</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:linear-gradient(160deg,#0b2a6b,#07194a 60%);color:#e9edf5;min-height:100vh}
.w{max-width:560px;margin:0 auto;padding:22px 16px 40px}header{text-align:center;margin:10px 0 22px}header img{width:72px;height:72px;border-radius:18px}h1{color:#f0b429;font-size:24px;margin:10px 0 2px}p.s{color:#a9b4c8;margin:0}
input{width:100%;padding:14px;border-radius:12px;border:1px solid rgba(240,180,41,.5);background:rgba(255,255,255,.07);color:#fff;font-size:20px;text-align:center;direction:ltr;margin:14px 0;letter-spacing:3px}
button{font:inherit;cursor:pointer}.b{background:linear-gradient(135deg,#f0b429,#c98a12);color:#07194a;font-weight:700;border:0;border-radius:12px;padding:12px 20px;font-size:16px}
.c{background:rgba(255,255,255,.06);border:1px solid rgba(240,180,41,.3);border-radius:16px;padding:16px;margin:12px 0}.c h2{margin:0 0 4px;font-size:19px;color:#fff}.c .m{color:#a9b4c8;font-size:14px;margin-bottom:12px}.c .r{display:flex;gap:8px;flex-wrap:wrap}.c .b{flex:1;min-width:120px;padding:11px}.c .b.o{background:transparent;color:#f0b429;border:1px solid #f0b429}
#e{color:#ff9d9d;text-align:center;min-height:22px}.cnt{color:#a9b4c8;font-size:13px;text-align:center;margin-top:18px}.lk{background:none;border:0;color:#a9b4c8;text-decoration:underline;font-size:13px;display:block;margin:18px auto 0}</style></head><body><div class="w">
<header><img src="4-icon-192.png" alt=""><h1>ملازم د. علي يونس</h1><p class="s">مكتبتي الخاصة</p></header>
<div id="lock"><p class="s" style="text-align:center">اكتب الكود الخاص بيك</p><input id="code" type="password" autocomplete="off" autocapitalize="none" spellcheck="false"><div style="text-align:center"><button class="b" id="go">فتح</button></div><div id="e"></div></div>
<div id="lib" style="display:none"><div id="list"></div><div class="cnt" id="cnt"></div><button class="lk" id="out">قفل</button></div>
</div>
<script>
const SALT=new TextEncoder().encode("dip-app-v1"),ITER=300000;let KEY=null;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function key(code){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:SALT,iterations:ITER,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"])}
async function dec(buf){const u=new Uint8Array(buf);return crypto.subtle.decrypt({name:"AES-GCM",iv:u.slice(0,12)},KEY,u.slice(12))}
async function unlock(){const e=document.getElementById("e");e.textContent="جاري التحقق...";try{KEY=await key(document.getElementById("code").value.trim());const r=await fetch("6-catalog.enc");const cat=JSON.parse(new TextDecoder().decode(await dec(await r.arrayBuffer())));show(cat);e.textContent="";try{sessionStorage.setItem("k",document.getElementById("code").value.trim())}catch(_){}}catch(x){KEY=null;e.textContent="الكود غير صحيح"}}
function show(cat){document.getElementById("lock").style.display="none";document.getElementById("lib").style.display="block";const L=document.getElementById("list");L.innerHTML="";cat.forEach(it=>{const d=document.createElement("div");d.className="c";const h=document.createElement("h2");h.textContent=it.title;const m=document.createElement("div");m.className="m";m.textContent=it.sub;const r=document.createElement("div");r.className="r";it.files.forEach(f=>{const b=document.createElement("button");b.className="b"+(f.type==="pdf"?"":" o");b.textContent=(f.type==="pdf"?"فتح PDF":"تحميل Word");b.onclick=()=>get(f,b,f.type==="pdf");r.appendChild(b)});d.append(h,m,r);L.appendChild(d)});document.getElementById("cnt").textContent=cat.length+" ملزمة"}
async function get(f,b,open){const t=b.textContent;b.textContent="جاري التحضير...";b.disabled=true;try{const r=await fetch(f.file);const p=await dec(await r.arrayBuffer());const mime=f.type==="pdf"?"application/pdf":"application/vnd.openxmlformats-officedocument.wordprocessingml.document";const url=URL.createObjectURL(new Blob([p],{type:mime}));if(open){window.open(url,"_blank")||(location.href=url)}else{const a=document.createElement("a");a.href=url;a.download=f.name;document.body.appendChild(a);a.click();a.remove()}}catch(x){alert("حصلت مشكلة، حاول تاني")}b.textContent=t;b.disabled=false}
document.getElementById("go").onclick=unlock;document.getElementById("code").onkeydown=e=>{if(e.key==="Enter")unlock()};
document.getElementById("out").onclick=()=>{KEY=null;sessionStorage.clear();location.reload()};
if("serviceWorker"in navigator)navigator.serviceWorker.register("3-sw.js");
</script></body></html>
