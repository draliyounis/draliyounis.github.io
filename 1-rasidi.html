<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>ملازمك - د. علي يونس</title>
<style>
:root{--gold:#f0b429;--ink:#07194a;--navy:#12233f;--mut:#a9b4c8;--txt:#e9edf5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--navy),var(--ink));color:var(--txt);font-family:Cairo,"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;display:flex;justify-content:center;padding:20px}
.card{width:100%;max-width:460px;border:2px solid var(--gold);border-radius:18px;padding:26px 22px;background:rgba(7,25,74,.55);align-self:flex-start;margin-top:20px}
.ban{background:#7a1f1f;color:#fff;border-radius:10px;padding:6px 10px;font-size:13px;text-align:center;margin-bottom:14px}
h1{color:var(--gold);text-align:center;margin:4px 0;font-size:26px}.sub{color:var(--mut);text-align:center;margin-bottom:18px}
input{width:100%;padding:14px;border-radius:10px;border:1px solid var(--gold);background:#0b1d44;color:#fff;font-size:18px;text-align:center;direction:ltr;letter-spacing:1px}
button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:10px;background:var(--gold);color:#07194a;font-weight:800;font-size:18px;font-family:inherit}
.err{color:#ff9a9a;text-align:center;margin-top:12px;min-height:22px}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 4px;border-bottom:1px solid rgba(240,180,41,.25);font-size:18px}.row span:first-child{color:var(--mut)}
.ok{color:#7fe3a0;font-weight:700}.rem{color:var(--gold);font-weight:700}.f{color:var(--mut);font-size:13px;text-align:center;margin-top:14px}
</style></head><body><div class="card">

<h1>ملازمك</h1><div class="sub">د. علي يونس · ادخل الكود الخاص بيك</div>
<div id="f"><input id="c" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="الكود"><button id="b" type="button">اعرض ملازمك</button><div class="err" id="e"></div></div>
<div id="r" style="display:none"></div></div>
<script>
const DATA={"d2c5f49f173f1970642ca7443caff1a8":{"iv":"cmuCas14","ct":"PWwXchiK0glCpqMI6fILaslrEecl0Q56xcGkweV0ZkqHv8jj0bvAWojESTFYKXWvwFF2/GyFCctiD4yDpVaV+vJLCNrJmk78x+3SGNNTHbSBhFxUDbCshxk1k01jKt4lmbjL+oXOEghDHQjBJ+X9JzMr4hNIC2zSTY2CHLAiU4xB5gQVR3Vbcsry8SFIbTSWzb8tkSHmwQLowejN"},"46cbe4d01060eade45e71d115c917d80":{"iv":"z3fHwiWP","ct":"gMq7nl72uAiZEMOGl04AWM4KdiBG4QhgS1FbAQvFM0LrhSQ+mw4+muRjElp9fJmsxv4GgDRDgzynJnPi4bjs1bbvSv5qTRVSbDlqIX5AJYmf5GgtgDtaB4hxVURhd4WGB/hSshxq4VrM/FnztwAoezB6E9lPljSncs66iGL9MXUtauQ+RX7Xuk1//RGjx4kRqVUwfcmakwUfSLFxHPrOfLTiPn2zW9NODUt33DWbFxfGPA89bLGnFA=="},"20fc5062416e5e0cfb8fd58cd6149463":{"iv":"y3yrKUm1","ct":"B8PYfbiIOaYySDwhxaE0Lt56VRaZbEMYn6QJHPn9H3V6BKPqBhRNc0xVa7wzwQHBYlwKPry7tahxEjN0BN683mLVixB3MBuiEyQao4EkJmaxDkdmCZaYm6sITLcCXOXS5t5QY/oftmJ6f0UT/q8CA+FtnrlEdBT1sSCZrTzJgpQe2KwNvVJozdGnKzkV7AlaMQe7mrEmxLapZ2v09Ovdj7e5zq2z"}},ITER=600000;
const enc=new TextEncoder(),b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function kdf(code,salt,bits){const k=await crypto.subtle.importKey("raw",enc.encode(code),"PBKDF2",false,["deriveBits"]);return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:enc.encode(salt),iterations:ITER},k,bits))}
async function show(code){
 const e=document.getElementById("e");e.textContent="جاري التحقق...";code=code.trim().toLowerCase();
 if(!code){e.textContent="اكتب الكود";return}
 try{const dk=await kdf(code,"balance-v2",384);
 const id=[...dk.slice(0,16)].map(x=>x.toString(16).padStart(2,"0")).join("");
 const rec=DATA[id];if(!rec)throw 0;
 const key=await crypto.subtle.importKey("raw",dk.slice(16,48),"AES-GCM",false,["decrypt"]);
 const d=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(rec.iv)},key,b64(rec.ct))));
 const li=a=>a.length?a.join("، "):"-";
 document.getElementById("f").style.display="none";const r=document.getElementById("r");r.style.display="block";
 r.innerHTML='<div class="row"><span>الاسم</span><b></b></div><div class="row"><span>حالة الدفع</span><span class="st"></span></div><div class="row"><span>المبلغ المدفوع</span><b></b></div><div class="row"><span>الملازم المستلمة</span><span class="ok"></span></div><div class="row"><span>المتبقي</span><span class="rem"></span></div><div class="f"></div>';
 const q=r.querySelectorAll("b,.st,.ok,.rem,.f");q[0].textContent=d.name;q[1].textContent=d.paid>0?"✔ تم الدفع":"✖ لم يتم الدفع";q[1].className=d.paid>0?"ok":"rem";q[2].textContent=d.paid+" جنيه";q[3].textContent=li(d.got);q[4].textContent=li(d.left);q[5].textContent="آخر تحديث: "+d.updated;
 e.textContent="";}catch(x){e.textContent="الكود غير صحيح"}}
document.getElementById("b").onclick=()=>show(document.getElementById("c").value);
document.getElementById("c").onkeydown=e=>{if(e.key==="Enter")show(e.target.value)};
const h=location.hash.slice(1);if(h){document.getElementById("c").value=h;show(h)}
</script></body></html>
